name: Build Flick Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Build Android web bundle
        run: npm run build:android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Flick-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flick-Android
          path: android/app/build/outputs/apk/release/Flick-Android.apk

      - name: Publish rolling latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          NOTES="Build #${{ github.run_number }} (versionCode: ${{ github.run_number }})"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Flick Android (v1.0.${{ github.run_number }})" --notes "$NOTES"
            gh release upload "$TAG" android/app/build/outputs/apk/release/Flick-Android.apk --clobber
          else
            gh release create "$TAG" android/app/build/outputs/apk/release/Flick-Android.apk \
              --title "Flick Android (v1.0.${{ github.run_number }})" \
              --notes "$NOTES"
          fi
